<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./api-product-catalogue.css" />
    <link rel="shortcut icon" href="data:," type="image/x-icon" />
    <title>MyStore API Catalogue</title>
  </head>
  <body>
    <h1>MyStore Product Catalogue</h1>

    <!-- SEARCH, SORT AND FILTER CONTROLS -->
    <section class="catalogue-controls" aria-label="Product controls">
      <div class="control-group search-group">
        <label for="product-search">Search products</label>
        <input
          type="search"
          id="product-search"
          placeholder="Search by product name..."
          disabled
        />
      </div>

      <div class="control-group">
        <label for="sort-products">Sort products</label>
        <select id="sort-products" disabled>
          <option value="default">Default order</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="a-z">A-Z</option>
        </select>
      </div>

      <div class="control-group">
        <label for="category-filter">Categories</label>
        <select id="category-filter" disabled>
          <option value="all">All Categories</option>
        </select>
      </div>

      <label for="stock-filter">
        <input type="checkbox" id="stock-filter" disabled />
        In-stock only
      </label>

      <label for="sale-filter">
        <input type="checkbox" id="sale-filter" disabled />
        On sale only
      </label>

      <button type="button" id="reset-filters-btn" disabled>
        Reset Filters
      </button>

      <button type="button" id="try-again-btn" hidden>Try Again</button>

      <p id="products-counter" role="status"></p>
    </section>

    <p id="loading-message">Loading products...</p>
    <p id="error-message" hidden>Error loading products!</p>
    <p id="no-products-message" hidden></p>

    <!-- PRODUCT LIST -->
    <section id="product-list"></section>
    <script type="module" src="./api-product-catalogue.js"></script>
    <script type="module" src="./product-selector-practice.js"></script>
  </body>
</html>
